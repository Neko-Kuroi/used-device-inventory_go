{{define "base"}}<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}中古端末在庫{{end}} - used-device-inventory</title>
<style>
  body { font-family: sans-serif; margin: 1em auto; max-width: 960px; padding: 0 1em; }
  header { display: flex; gap: 1em; align-items: baseline; flex-wrap: wrap; }
  header nav a { margin-right: .8em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: .35em .5em; text-align: left; }
  .flash { background: #fff3cd; padding: .5em .8em; border-radius: 4px; }
  label { display: block; margin: .6em 0 .2em; font-weight: bold; }
  input, select, textarea { width: 100%; padding: .4em; box-sizing: border-box; }
  button { padding: .5em 1.2em; margin-top: 1em; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1em; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <strong>中古端末在庫</strong>
  {{if .User}}
  <nav>
    <a href="/">在庫一覧</a>
    <a href="/devices/new">新規登録</a>
    {{if .User.IsAdmin}}<a href="/admin/users">ユーザー管理</a>{{end}}
  </nav>
  <span>{{.User.Username}}{{if .User.IsAdmin}}（管理者）{{end}}</span>
  <form method="post" action="/logout" style="display:inline">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <button type="submit" style="margin:0">ログアウト</button>
  </form>
  {{end}}
</header>
{{range .Flashes}}<p class="flash">{{.}}</p>
{{end}}
{{block "body" .}}{{end}}
</body>
</html>
{{end}}
