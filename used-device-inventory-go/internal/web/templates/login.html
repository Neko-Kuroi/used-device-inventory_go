{{define "title"}}ログイン{{end}}
{{define "body"}}
<h1>ログイン</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <label>ユーザー名</label>
  <input name="username" required>
  <label>パスワード</label>
  <input name="password" type="password" required>
  <button type="submit">ログイン</button>
</form>
{{end}}
